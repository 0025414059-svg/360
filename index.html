<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Xem Video 360 Tự Động</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* Xóa bỏ hoàn toàn CSS của nút bấm cũ để màn hình sạch sẽ */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body>

    <a-scene vr-mode-ui="enabled: false">
        <a-assets>
            <video id="video360" 
                   src="Lion-360.mp4" 
                   autoplay="true" 
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline="true" 
                   webkit-playsinline="true" 
                   muted="true">
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true;"></a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('video360');

        // Hàm kích hoạt toàn bộ tính năng (Âm thanh + Cảm biến iPhone)
        function activateFullExperience() {
            // Bật tiếng video
            if (video.muted) {
                video.muted = false;
                video.play().catch(function(error) {
                    console.log("Chờ tương tác tiếp theo để phát nhạc");
                });
            }

            // Kích hoạt cảm biến xoay nếu là iPhone (iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            // Cảm biến đã được bật thành công
                        }
                    })
                    .catch(console.error);
            }

            // Sau khi người dùng chạm lần đầu tiên, gỡ bỏ sự kiện này để không lặp lại
            window.removeEventListener('click', activateFullExperience);
            window.removeEventListener('touchstart', activateFullExperience);
        }

        // Lắng nghe thao tác chạm vào màn hình của người dùng để bật full tính năng
        window.addEventListener('click', activateFullExperience);
        window.addEventListener('touchstart', activateFullExperience);

        // Cố gắng ép video chạy ngay khi vừa load xong trang (chạy ẩn/tắt tiếng)
        document.addEventListener("DOMContentLoaded", function() {
            video.play();
        });
    </script>
</body>
</html>
