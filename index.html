<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Xem Video 360 Của Tôi</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* Giao diện nút yêu cầu quyền cảm biến */
        #permission-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 15px 30px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <button id="permission-btn">Mở Video & Bật Cảm Biến Xoay</button>

    <a-scene>
        <a-assets>
            <video id="video360" 
                   src="Lion-360.mp4" 
                   autoplay 
                   loop 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline 
                   muted>
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true;"></a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('permission-btn');
        const video = document.getElementById('video360');

        function startApp() {
            video.play();
            // Bỏ chế độ tắt tiếng sau khi người dùng đã tương tác bấm nút
            video.muted = false; 
            btn.classList.add('hidden');
        }

        btn.addEventListener('click', function() {
            // Xin quyền cảm biến xoay cho iOS (iPhone)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startApp();
                        } else {
                            alert('Bạn cần cho phép quyền cảm biến để xoay được video!');
                        }
                    })
                    .catch(console.error);
            } else {
                // Android hoặc Máy tính thì chạy luôn
                startApp();
            }
        });

        // Đổi chữ trên nút nếu là PC
        if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            btn.textContent = "Click để xem Video (Trình duyệt PC)";
        }
    </script>
</body>
</html>
