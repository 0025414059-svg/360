<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Xem Video 360 Độ</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* Giao diện nút yêu cầu quyền cảm biến trên iOS */
        #permission-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Ẩn nút khi đã cấp quyền */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <button id="permission-btn">Kích hoạt cảm biến xoay (Gyroscope)</button>

    <a-scene>
        <a-assets>
            <video id="video360" 
                   src="Lion-360.mp4" 
                   autoplay 
                   loop 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline 
                   muted>
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true;"></a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('permission-btn');
        const video = document.getElementById('video360');

        // Hàm khởi chạy video sau khi có tương tác người dùng
        function startApp() {
            video.play();
            btn.classList.add('hidden');
        }

        btn.addEventListener('click', function() {
            // Kiểm tra nếu là thiết bị iOS (yêu cầu xin quyền DeviceOrientation)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startApp();
                        } else {
                            alert('Bạn cần cấp quyền cảm biến để xoay được video!');
                        }
                    })
                    .catch(console.error);
            } else {
                // Đối với Android hoặc PC không cần xin quyền đặc biệt
                startApp();
            }
        });

        // Tự động ẩn nút nếu trên PC (vì PC không có cảm biến gyro)
        if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            btn.textContent = "Click để phát Video (Trình duyệt PC)";
        }
    </script>
</body>
</html>
